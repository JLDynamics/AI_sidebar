<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sidebar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sidebar.css">
    <script src="pdf.min.js"></script>
    <script src="marked.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Lightbox for Image Zoom -->
        <div id="lightbox" class="lightbox">
            <span class="lightbox-close">&times;</span>
            <img class="lightbox-content" id="lightboxImg">
        </div>

        <!-- History Drawer -->
        <div class="history-drawer" id="historyDrawer">
            <div class="history-header">
                <button id="newChatBtn" class="new-chat-btn">
                    <span class="icon">+</span> New Chat
                </button>
                <button id="historyCloseBtn" class="icon-btn close-drawer-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="history-list" id="historyList">
                <!-- History items will be injected here -->
            </div>
        </div>

        <!-- Overlay for closing drawer (Desktop/Mobile) -->
        <div class="history-overlay" id="historyOverlay"></div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <button id="toggleHistoryBtn" class="icon-btn" title="Toggle History">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Chat Area -->
            <div class="chat-container" id="chatContainer">
                <!-- Messages will be injected here -->
                <div class="welcome-message">
                    <div class="welcome-icon">✨</div>
                    <h2>How can I help you today?</h2>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <!-- Drag Drop Overlay -->
                <div id="dragDropOverlay" class="drag-drop-overlay">
                    <div class="drag-drop-message">Drop to Upload</div>
                </div>

                <div class="input-container" id="inputContainer">
                    <!-- Preview MOVED INSIDE -->
                    <div class="image-preview-container" id="imagePreviewContainer" style="display: none;">
                        <!-- Preview Injected Here -->
                    </div>

                    <div class="input-row">
                        <input type="file" id="fileInput"
                            accept="image/jpeg, image/png, image/webp, image/gif, .txt, .md, .js, .py, .html, .css, .json, .pdf"
                            style="display: none;">
                        <textarea id="chatInput" placeholder="Ask anything... (Type, Paste, or Drop)"
                            rows="1"></textarea>
                    </div>

                    <div class="input-controls">
                        <button id="uploadBtn" class="upload-btn plus-btn" title="Add file or photo">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>

                        <div id="attachMenu" class="attach-menu">
                            <button id="attachPhotoBtn" class="attach-option">🖼️ Add photo</button>
                            <button id="attachFileBtn" class="attach-option">📄 Add file</button>
                        </div>

                        <span class="controls-spacer"></span>

                        <button id="modelBtn" class="model-btn" title="Choose model and think effort">deepseek</button>

                        <button id="sendBtn" class="send-btn" title="Send">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="19" x2="12" y2="5"></line>
                                <polyline points="5 12 12 5 19 12"></polyline>
                            </svg>
                        </button>
                    </div>

                    <div id="modelPanel" class="model-panel"></div>
                </div>
                <div class="input-footer">
                    AI can make mistakes. Check important info.
                </div>
            </div>
        </div>
    </div>
    <script src="config.js"></script>

    <script type="module" src="js/app.js"></script>
</body>

</html>
